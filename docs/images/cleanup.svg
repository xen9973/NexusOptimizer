<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Очистка ПК в Nexus Optimizer</title>
  <desc id="desc">Демонстрация анализа временных файлов с предварительным просмотром и исключениями.</desc>
  <style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#f4f6fa}.muted{fill:#98a4b5}.body{fill:#d2d9e5}.small{font-size:14px}.tiny{font-size:12px}.heading{font-size:28px;font-weight:600}.panel{fill:#171c25;stroke:#2c3543}.card{fill:#1d2430;stroke:#2c3543}.line{stroke:#2c3543}.accent{fill:#5b96ff}</style>
  <rect width="1280" height="820" rx="18" fill="#10141b"/>
  <rect width="1280" height="42" rx="18" fill="#171c25"/><path d="M0 41.5h1280" class="line"/>
  <rect x="16" y="9" width="24" height="24" rx="7" class="accent"/><text x="28" y="27" text-anchor="middle" font-size="15" font-weight="700">N</text>
  <text x="50" y="27" class="small" font-weight="600">Nexus Optimizer</text><text x="1192" y="28" class="small muted">—　□　×</text>
  <rect y="42" width="232" height="778" fill="#171c25"/><path d="M231.5 42v778" class="line"/>
  <rect x="22" y="68" width="40" height="40" rx="12" class="accent"/><text x="42" y="96" text-anchor="middle" font-size="22" font-weight="700">N</text>
  <text x="74" y="85" class="small" font-weight="600">Nexus Optimizer</text><text x="74" y="104" class="tiny muted">Игры и обслуживание ПК</text>
  <text x="34" y="168" class="small" fill="#98a4b5" font-weight="600">▦　Библиотека</text>
  <rect x="16" y="188" width="200" height="44" rx="10" fill="#233754"/><text x="34" y="216" class="small" fill="#bed5ff" font-weight="600">⌁　Очистка ПК</text>
  <text x="34" y="268" class="small muted" font-weight="600">⚙　Настройка компьютера</text><text x="34" y="316" class="small muted" font-weight="600">⌕　Умная настройка</text>
  <text x="34" y="754" class="small body">◐　Сменить тему</text><rect x="24" y="772" width="184" height="30" rx="9" fill="#20342f"/>
  <text x="116" y="792" text-anchor="middle" class="small" fill="#54d6a0">✓　Безопасный режим</text>
  <text x="264" y="96" class="heading">Очистка ПК</text><text x="264" y="122" class="small muted">Анализируйте категории и проверьте результат перед очисткой</text>
  <rect x="954" y="76" width="132" height="42" rx="10" fill="#252e3b"/><text x="1020" y="102" text-anchor="middle" class="small" font-weight="600">Проанализировать</text>
  <rect x="1096" y="76" width="160" height="42" rx="10" class="accent"/><text x="1176" y="102" text-anchor="middle" class="small" font-weight="600">Очистить выбранное</text>
  <rect x="264" y="148" width="992" height="68" rx="12" fill="#3a2f1a"/>
  <text x="284" y="176" class="small body">Перед удалением вы увидите итог и сможете его подтвердить.</text>
  <text x="284" y="198" class="tiny muted">Свежие файлы и файлы, занятые другими программами, пропускаются.</text>
  <text x="264" y="252" class="small muted">Исключения</text>
  <rect x="350" y="232" width="208" height="36" rx="9" fill="#252e3b"/><text x="454" y="255" text-anchor="middle" class="tiny body">Добавить папку-исключение</text>
  <text x="574" y="255" class="tiny muted">Папки из списка очистка не трогает.</text>
  <rect x="264" y="284" width="992" height="460" rx="16" class="panel"/>
  <text x="288" y="324" font-size="17" font-weight="600">Категории для анализа</text>
  <g>
    <rect x="286" y="346" width="948" height="68" rx="12" class="card"/>
    <rect x="306" y="370" width="18" height="18" rx="4" fill="#5b96ff"/><path d="m310 379 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="342" y="375" class="small" font-weight="600">Временные файлы пользователя</text><text x="342" y="397" class="tiny muted">Файлы старше суток в папке TEMP</text><text x="1178" y="386" text-anchor="end" class="small body">142 МБ</text>
    <rect x="286" y="426" width="948" height="68" rx="12" class="card"/>
    <rect x="306" y="450" width="18" height="18" rx="4" fill="#5b96ff"/><path d="m310 459 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="342" y="455" class="small" font-weight="600">Временные файлы Windows</text><text x="342" y="477" class="tiny muted">Часть файлов может быть занята системой</text><text x="1178" y="466" text-anchor="end" class="small body">86 МБ</text>
    <rect x="286" y="506" width="948" height="68" rx="12" class="card"/>
    <rect x="306" y="530" width="18" height="18" rx="4" fill="#5b96ff"/><path d="m310 539 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="342" y="535" class="small" font-weight="600">Кэш шейдеров видеокарты</text><text x="342" y="557" class="tiny muted">Кэш DirectX, NVIDIA и AMD</text><text x="1178" y="546" text-anchor="end" class="small body">318 МБ</text>
    <rect x="286" y="586" width="948" height="68" rx="12" class="card"/>
    <rect x="306" y="610" width="18" height="18" rx="4" fill="#5b96ff"/><path d="m310 619 4 4 7-8" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="342" y="615" class="small" font-weight="600">Дампы после сбоев</text><text x="342" y="637" class="tiny muted">Файлы отчётов о сбоях приложений</text><text x="1178" y="626" text-anchor="end" class="small body">24 МБ</text>
    <rect x="286" y="666" width="948" height="52" rx="12" class="card"/>
    <rect x="306" y="683" width="18" height="18" rx="4" fill="#141922" stroke="#5b96ff"/>
    <text x="342" y="697" class="small" font-weight="600">Корзина</text><text x="1178" y="697" text-anchor="end" class="small muted">Не выбрана</text>
  </g>
  <text x="264" y="790" class="tiny muted">Демонстрационный интерфейс</text>
</svg>
