<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Настройка компьютера в Nexus Optimizer</title>
  <desc id="desc">Демонстрация категорий настроек Windows и обратимых изменений.</desc>
  <style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#f4f6fa}.muted{fill:#98a4b5}.body{fill:#d2d9e5}.small{font-size:14px}.tiny{font-size:12px}.heading{font-size:28px;font-weight:600}.panel{fill:#171c25;stroke:#2c3543}.card{fill:#1d2430;stroke:#2c3543}.line{stroke:#2c3543}.accent{fill:#5b96ff}</style>
  <rect width="1280" height="820" rx="18" fill="#10141b"/>
  <rect width="1280" height="42" rx="18" fill="#171c25"/><path d="M0 41.5h1280" class="line"/>
  <rect x="16" y="9" width="24" height="24" rx="7" class="accent"/><text x="28" y="27" text-anchor="middle" font-size="15" font-weight="700">N</text>
  <text x="50" y="27" class="small" font-weight="600">Nexus Optimizer</text><text x="1192" y="28" class="small muted">—　□　×</text>
  <rect y="42" width="232" height="778" fill="#171c25"/><path d="M231.5 42v778" class="line"/>
  <rect x="22" y="68" width="40" height="40" rx="12" class="accent"/><text x="42" y="96" text-anchor="middle" font-size="22" font-weight="700">N</text>
  <text x="74" y="85" class="small" font-weight="600">Nexus Optimizer</text><text x="74" y="104" class="tiny muted">Игры и обслуживание ПК</text>
  <text x="34" y="168" class="small muted" font-weight="600">▦　Библиотека</text><text x="34" y="216" class="small muted" font-weight="600">⌁　Очистка ПК</text>
  <rect x="16" y="236" width="200" height="44" rx="10" fill="#233754"/><text x="34" y="264" class="small" fill="#bed5ff" font-weight="600">⚙　Настройка компьютера</text>
  <text x="34" y="316" class="small muted" font-weight="600">⌕　Умная настройка</text><text x="34" y="754" class="small body">◐　Сменить тему</text>
  <rect x="24" y="772" width="184" height="30" rx="9" fill="#20342f"/><text x="116" y="792" text-anchor="middle" class="small" fill="#54d6a0">✓　Безопасный режим</text>
  <text x="264" y="96" class="heading">Настройка компьютера</text>
  <text x="264" y="122" class="small muted">Общие настройки Windows: производительность, игры, приватность и питание.</text>
  <rect x="264" y="148" width="992" height="64" rx="12" fill="#3a2f1a"/>
  <text x="284" y="176" class="small body">Исходные значения сохраняются для восстановления.</text>
  <text x="284" y="198" class="tiny muted">Выбор категорий и пресета ничего не меняет до нажатия «Применить».</text>
  <text x="264" y="248" class="small muted">Категории</text>
  <g>
    <rect x="264" y="262" width="190" height="56" rx="12" fill="#233754" stroke="#5b96ff"/>
    <text x="280" y="286" class="small" fill="#bed5ff" font-weight="600">⚡　Производительность</text><text x="280" y="306" class="tiny muted">4 настройки</text>
    <rect x="464" y="262" width="140" height="56" rx="12" class="card"/><text x="480" y="286" class="small body" font-weight="600">🎮　Игры</text><text x="480" y="306" class="tiny muted">3 настройки</text>
    <rect x="614" y="262" width="152" height="56" rx="12" class="card"/><text x="630" y="286" class="small body" font-weight="600">◈　Приватность</text><text x="630" y="306" class="tiny muted">2 настройки</text>
    <rect x="776" y="262" width="178" height="56" rx="12" class="card"/><text x="792" y="286" class="small body" font-weight="600">↗　Автозагрузка</text><text x="792" y="306" class="tiny muted">2 настройки</text>
    <rect x="964" y="262" width="132" height="56" rx="12" class="card"/><text x="980" y="286" class="small body" font-weight="600">ϟ　Питание</text><text x="980" y="306" class="tiny muted">2 настройки</text>
    <rect x="1106" y="262" width="150" height="56" rx="12" class="card"/><text x="1122" y="286" class="small body" font-weight="600">▤　Проводник</text><text x="1122" y="306" class="tiny muted">2 настройки</text>
  </g>
  <text x="264" y="354" class="small muted">Пресет</text>
  <rect x="328" y="334" width="142" height="32" rx="16" fill="#233754" stroke="#5b96ff"/><text x="399" y="355" text-anchor="middle" class="tiny" fill="#bed5ff">Сбалансированный</text>
  <rect x="478" y="334" width="164" height="32" rx="16" class="card"/><text x="560" y="355" text-anchor="middle" class="tiny body">Производительность</text>
  <rect x="650" y="334" width="122" height="32" rx="16" class="card"/><text x="711" y="355" text-anchor="middle" class="tiny body">Приватность</text>
  <rect x="264" y="382" width="992" height="322" rx="16" class="panel"/>
  <text x="288" y="422" font-size="17" font-weight="600">Производительность</text>
  <g>
    <rect x="286" y="444" width="948" height="54" rx="10" class="card"/>
    <rect x="306" y="462" width="18" height="18" rx="4" fill="#141922" stroke="#5b96ff"/>
    <text x="342" y="468" class="small" font-weight="600">Отключить анимацию окон</text><text x="342" y="488" class="tiny muted">Визуальная настройка интерфейса Windows</text><text x="1208" y="478" text-anchor="end" class="tiny" fill="#54d6a0">Обратимо</text>
    <rect x="286" y="508" width="948" height="54" rx="10" class="card"/>
    <rect x="306" y="526" width="18" height="18" rx="4" fill="#141922" stroke="#5b96ff"/>
    <text x="342" y="532" class="small" font-weight="600">Уменьшить задержку меню</text><text x="342" y="552" class="tiny muted">Меню Windows будут открываться быстрее</text><text x="1208" y="542" text-anchor="end" class="tiny" fill="#54d6a0">Обратимо</text>
    <rect x="286" y="572" width="948" height="54" rx="10" class="card"/>
    <rect x="306" y="590" width="18" height="18" rx="4" fill="#141922" stroke="#5b96ff"/>
    <text x="342" y="596" class="small" font-weight="600">Отключить эффекты прозрачности</text><text x="342" y="616" class="tiny muted">Меняется только оформление Windows</text><text x="1208" y="606" text-anchor="end" class="tiny" fill="#54d6a0">Обратимо</text>
    <rect x="286" y="636" width="948" height="54" rx="10" class="card"/>
    <rect x="306" y="654" width="18" height="18" rx="4" fill="#141922" stroke="#5b96ff"/>
    <text x="342" y="660" class="small" font-weight="600">Включить схему «Высокая производительность»</text><text x="342" y="680" class="tiny muted">Может увеличить энергопотребление</text><text x="1208" y="670" text-anchor="end" class="tiny" fill="#54d6a0">Обратимо</text>
  </g>
  <rect x="1088" y="730" width="168" height="44" rx="10" class="accent"/><text x="1172" y="757" text-anchor="middle" class="small" font-weight="600">Применить</text>
  <text x="264" y="790" class="tiny muted">Демонстрационный интерфейс</text>
</svg>
